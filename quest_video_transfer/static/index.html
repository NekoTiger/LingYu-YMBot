<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f1ea">
  <title>Quest 视频传输</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 9.5A4.5 4.5 0 0 1 9.5 5h5A4.5 4.5 0 0 1 19 9.5v5a4.5 4.5 0 0 1-4.5 4.5h-5A4.5 4.5 0 0 1 5 14.5v-5Z"/>
            <path d="M9.5 10.25v3.5l4-1.75-4-1.75Z"/>
          </svg>
        </span>
        <div>
          <p class="eyebrow">局域网直传</p>
          <h1>Quest 视频</h1>
        </div>
      </div>
      <div class="online-state" id="online-state">
        <span class="online-dot" aria-hidden="true"></span>
        <span id="online-label">连接电脑</span>
      </div>
    </header>

    <main>
      <div class="hero-grid">
        <section class="panel upload-panel" aria-labelledby="upload-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">发送</p>
              <h2 id="upload-title">传回电脑</h2>
            </div>
            <span class="quiet-label">同一 Wi-Fi</span>
          </div>

          <input
            id="file-input"
            class="visually-hidden"
            type="file"
            accept="video/*,.mp4,.mov,.m4v,.webm"
            multiple>

          <button class="dropzone" id="dropzone" type="button">
            <span class="upload-glyph" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path d="M16 21V7m0 0-6 6m6-6 6 6"/>
                <path d="M6 20v3.5A2.5 2.5 0 0 0 8.5 26h15a2.5 2.5 0 0 0 2.5-2.5V20"/>
              </svg>
            </span>
            <span class="drop-title">选择视频</span>
            <span class="drop-note">可一次选择多个</span>
          </button>
          <p class="picker-hint">选择器里看不到录像时，打开“最近”或“视频”。</p>
        </section>

        <aside class="panel connect-panel" aria-labelledby="connect-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">连接</p>
              <h2 id="connect-title">在 Quest 3 打开</h2>
            </div>
            <span class="live-badge"><span aria-hidden="true"></span>在线</span>
          </div>

          <button class="address-button" id="copy-url" type="button" aria-label="复制访问链接">
            <span id="display-url">正在获取地址…</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="8" y="8" width="11" height="11" rx="2"/>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
            </svg>
          </button>

          <div class="qr-frame" id="qr-frame">
            <div class="qr-loading" id="qr-loading" aria-hidden="true"></div>
            <img id="qr-code" alt="Quest 3 访问二维码">
          </div>
          <p class="connect-hint">扫码，或用浏览器打开上面的地址。</p>
        </aside>
      </div>

      <section class="transfer-section" id="transfer-section" hidden aria-labelledby="transfer-title">
        <div class="section-heading">
          <h2 id="transfer-title">传输</h2>
          <span class="section-meta" id="transfer-count"></span>
        </div>
        <ul class="transfer-list" id="transfer-list"></ul>
      </section>

      <section class="received-section" aria-labelledby="received-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">电脑上</p>
            <h2 id="received-title">已接收</h2>
          </div>
          <div class="section-actions">
            <button class="text-button" id="open-folder" type="button" hidden>
              打开文件夹
            </button>
            <button class="icon-button" id="refresh-files" type="button" aria-label="刷新文件列表">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M20 7v5h-5"/>
                <path d="M19 12a7 7 0 1 0-2 5"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="empty-state" id="empty-state">
          <span class="empty-glyph" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect x="5" y="9" width="22" height="15" rx="3"/>
              <path d="M12 9l1.5-3h5L20 9"/>
              <circle cx="16" cy="16.5" r="4"/>
            </svg>
          </span>
          <p>还没有收到视频</p>
        </div>
        <ul class="file-list" id="file-list"></ul>
      </section>

      <footer class="footer">
        <span>保存到</span>
        <code id="upload-dir">正在读取…</code>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
